server:
  port: 8080
  servlet:
    context-path: /api

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${SPRING_DATASOURCE_URL_HOST:postgres}:5432/${SPRING_DATASOURCE_DB:plm_v4}?stringtype=unspecified
    username: ${SPRING_DATASOURCE_USERNAME:plm}
    password: ${SPRING_DATASOURCE_PASSWORD:plm@123}
    druid:
      initial-size: 3
      min-idle: 3
      max-active: 10
  redis:
    host: ${SPRING_REDIS_HOST:localhost}
    port: 6379
    timeout: 3000
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.hjgd.plm.*.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    # 隐私要求(F7/N7): 生产禁用 SQL 参数明文日志, 防止 plm_feedback.contact 等字段外泄。
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

plm:
  jwt:
    secret: HjgdPlmV4SecretKeyForJwtTokenSigningMustBeLongEnough2026
    expire: 86400
    header: Authorization
    prefix: 'Bearer '
  file:
    upload-dir: ${PLM_FILE_UPLOAD_DIR:/data/files}
    intranet-dir: ${PLM_FILE_INTRANET_DIR:/data/files/intranet}
    extranet-dir: ${PLM_FILE_EXTRANET_DIR:/data/files/extranet}
  algorithm:
    base-url: ${PLM_ALGORITHM_BASE_URL:http://localhost:8001}
  integration:
    erp:
      base-url: ${ERP_BASE_URL:}
      enabled: ${ERP_ENABLED:false}
    mes:
      base-url: ${MES_BASE_URL:}
      enabled: ${MES_ENABLED:false}

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    # 生产硬编码 info(不开放环境变量覆盖): MyBatis SQL 的 DEBUG 日志永不上日志。
    com.hjgd.plm: info

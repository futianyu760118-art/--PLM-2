server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: plm-backend
  profiles:
    active: dev
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: org.postgresql.Driver
    url: "jdbc:postgresql://localhost:5432/plm_v4?stringtype=unspecified&TZ=Asia/Shanghai"
    username: plm
    password: plm@123
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 5000
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.hjgd.plm.*.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    # 隐私要求(F7/N7): SQL 及绑定参数一律不得进入运行日志。
    # 原 StdOutImpl 会把 INSERT 语句连同参数明文打到 stdout,plm_feedback.contact 等隐私字段随之外泄;
    # 且它写在基线配置里, prod 未覆盖, 生产同样在打。统一走 Slf4jImpl + 见下方 logging.level=info,
    # MyBatis 的 DEBUG 级 SQL 日志默认不输出。本地排查需看 SQL 时用 PLM_LOG_LEVEL=debug 临时启动。
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

plm:
  jwt:
    secret: HjgdPlmV4SecretKeyForJwtTokenSigningMustBeLongEnough2026
    expire: 86400
    header: Authorization
    prefix: 'Bearer '
  file:
    upload-dir: D:/PLM-2/files
    intranet-dir: D:/PLM-2/files/intranet
    extranet-dir: D:/PLM-2/files/extranet
  algorithm:
    base-url: http://localhost:8001
  # 大模型(OpenAI 兼容 /chat/completions)：智能体回复与 AEOS 执行面推理用；key 未配置时自动回落模板回复
  llm:
    base-url: ${PLM_LLM_BASE_URL:}
    api-key: ${PLM_LLM_API_KEY:}
    model: ${PLM_LLM_MODEL:}
  # AEOS Hub 能力调用(PLM 作为跨系统请求方, 借调 Hub 能力目录里的只读能力, 如 query_control_platform)
  hub:
    base-url: ${AEOS_HUB_BASE_URL:https://aeos-hub.test:9444}
    system-id: ${AEOS_HUB_SYSTEM_ID:hengjian-plm}
    system-token: ${AEOS_HUB_SYSTEM_TOKEN:}
    contract-version: ${AEOS_HUB_CONTRACT_VERSION:4.0}
    from-agent-id: ${AEOS_HUB_FROM_AGENT_ID:plm-agent-orch}
    poll-interval-ms: 1000
    poll-timeout-ms: 30000
    # 内网试点阶段 Hub 用自签证书；置 true 时仅对 Hub 出站连接忽略证书校验(不关闭全局 TLS)
    insecure: ${AEOS_HUB_INSECURE:true}
  integration:
    erp:
      base-url: ${ERP_BASE_URL:}
      enabled: ${ERP_ENABLED:false}
    mes:
      base-url: ${MES_BASE_URL:}
      enabled: ${MES_ENABLED:false}
  job:
    # V1.1 定时任务默认开启，时序：DQ夜检(01:00) → 度量日批(01:30) → KPI结算(02:00)
    dq:
      enabled: true
      cron: "0 0 1 * * ?"
    metric:
      enabled: true
      cron: "0 30 1 * * ?"
    kpi:
      enabled: true
      cron: "0 0 2 * * ?"
    draft-aged-days: 7
    ecn-cycle-window-days: 30
  webhook:
    enabled: ${WEBHOOK_ENABLED:false}
  # 证据台账(能力线 A)边界值, 默认即 PAND-198 的 AC 取值; 部署侧可覆盖调整上限。
  ledger:
    max-attachments: 20          # AC-A1-4 单条证据附件数上限(批量上传单次文件数同此值 AC-A5-6)
    max-file-size-mb: 200        # AC-A1-5 单文件大小上限 MB(等于上限可通过)
    max-links: 20                # AC-A4-1 单条证据关联对象数上限
    batch-link-max: 100          # AC-A5-7 批量关联单次可选证据条数上限
    name-max: 100                # AC-A2-3 证据名称最大长度
    remark-max: 500              # AC-A2-3 备注最大长度
    version-max: 20              # AC-A2-3 版本最大长度
    notify-aggregate-minutes: 5  # AC-A4-10 变更通知聚合窗口(分钟)
    log-retain-days: 1095        # AC-A6-6 操作日志保留天数(3 年)
    allow-exts:                  # AC-A1-6 附件格式白名单
      - .pdf
      - .doc
      - .docx
      - .xls
      - .xlsx
      - .ppt
      - .pptx
      - .jpg
      - .jpeg
      - .png
      - .zip
      - .rar
      - .dwg
      - .dxf

  # 资料分类订阅与报告推送(能力线 B)边界值, 默认即 PAND-198 的 AC 取值。
  subscription:
    dim-name-max: 20         # AC-B1-1 维度名称长度上限(字)
    value-name-max: 30       # AC-B1-1 分类值长度上限(字)
    sub-name-max: 64         # 订阅名称长度上限
    max-dims-per-dept: 10    # AC-B1-2 单部门分类维度上限
    max-values-per-dim: 50   # AC-B1-3 单维度分类值上限
    max-period-per-user: 20  # AC-B4-9 周期订阅数量上限(条/人)
    report-retain: 12        # AC-B5-7 报告保留/可回溯期数
    report-retry: 3          # AC-B5-5 报告生成失败重试次数
    default-push-time: "08:00"  # AC-B5-1 默认推送时点
    link-base-url: ""        # AC-B5-2 报告内链接的前端基地址, 留空输出相对路径(由前端同源解析)
    schedule-enabled: true   # 周期报告调度开关(关闭后不生成, 便于灰度/测试)
    mail-enabled: false      # AC-B5 邮件渠道开关; 未配置 SMTP 时保持 false, 报告仅走站内通知
    mail-from-name: "恒剑光电 PLM"
# 邮件渠道启用示例(需同时把 plm.subscription.mail-enabled 置为 true):
#spring:
#  mail:
#    host: smtp.exmail.qq.com
#    port: 465
#    username: no-reply@hjgd.local
#    password: ${PLM_MAIL_PASSWORD:}
#    properties:
#      mail.smtp.auth: true
#      mail.smtp.ssl.enable: true

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    # 收敛业务包日志级别: MyBatis SQL 走 DEBUG, 默认 info 即不上日志,
    # 保证任何隐私字段(如 plm_feedback.contact)不因 SQL 参数日志外泄。
    com.hjgd.plm: ${PLM_LOG_LEVEL:info}

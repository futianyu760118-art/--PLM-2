const ACTUAL = { 1:1, 2:1, 3:0.85, 4:0, 5:0.4, 6:0, 7:0, 8:0, 9:0, 10:0, 11:0, 12:0, 13:0, 14:0, 15:0, 16:0, 17:0, 18:0, 19:0, 20:0, 21:0 };

const TODAY = '2026-10-20';
const RANGE_START = D('2026-09-28');
const RANGE_END = D('2027-01-03');
const DAYW = 7; // px/day

function x(date){ return (D(date) - RANGE_START) * DAYW; }
function w(s,e){ return (D(e) - D(s) + 1) * DAYW; }
function isWeekend(date){ const dt = new Date(D(date)*DAY); const d = dt.getUTCDay(); return d===0 || d===6; }

/* 渲染时间轴(月行+日行)，返回 HTML 字符串 */
function axisHTML(width){
  let html = `<div class="gr-axis" style="width:${width}px"><div style="position:relative;height:50px">`;
  let m = new Date(Date.UTC(2026,9,1));
  while(D(m.toISOString().slice(0,10)) <= RANGE_END){
    const next = new Date(Date.UTC(m.getUTCFullYear(), m.getUTCMonth()+1, 1));
    const s = Math.max(D(m.toISOString().slice(0,10)), RANGE_START);
    const e = Math.min(D(next.toISOString().slice(0,10))-1, RANGE_END);
    const left = x(m.toISOString().slice(0,10));
    const width = (e - s + 1) * DAYW;
    html += `<div class="gr-month" style="left:${left}px;width:${width}px">${m.getUTCFullYear()}-${String(m.getUTCMonth()+1).padStart(2,'0')}</div>`;
    m = next;
  }
  for(let d=RANGE_START; d<=RANGE_END; d++){
    const dayNum = new Date(d*DAY).getUTCDate();
    const first = dayNum===1;
    html += `<div class="gr-day ${first?'first':''}" style="left:${(d-RANGE_START)*DAYW}px">${first?'1':dayNum}</div>`;
  }
  html += '</div></div>';
  return html;
}

/* 周末背景 + 今天线，返回 HTML 字符串 */
function weekendTodayHTML(height){
  let html = '';
  for(let d=RANGE_START; d<=RANGE_END; d++){
    const dt = new Date(d*DAY);
    if(dt.getUTCDay()===0 || dt.getUTCDay()===6){
      html += `<div class="gr-row weekend" style="position:absolute;top:0;left:${(d-RANGE_START)*DAYW}px;width:${DAYW}px;height:${height}px;z-index:0"></div>`;
    }
  }
  html += `<div class="today-line" style="left:${x(TODAY)}px;height:${height}px"><div class="today-tag">今天</div></div>`;
  return html;
}

/* 行内条/里程碑，返回 HTML 字符串 */
function rowHTML(rows){
  let html = '';
  rows.forEach((r, i)=>{
    const top = i*34;
    if(r.bars) r.bars.forEach(b=>{
      html += `<div class="bar ${b.cls||'s1'}" style="left:${x(b.s)}px;width:${Math.max(w(b.s,b.e),2)}px;top:${top+7}px" title="${(b.title||'').replace(/"/g,'&quot;')}">${b.text||''}</div>`;
    });
    if(r.ms) r.ms.forEach(m=>{
      html += `<div class="ms ${m.cls||'todo'}" style="left:${x(m.d)-6}px;top:${top+11}px" title="${(m.title||'').replace(/"/g,'&quot;')}"></div>`;
    });
  });
  return html;
}

/* 通用甘特画布：rows 为 {label, cls, indent, bars:[{s,e,cls,text}], ms:[{d,cls,title}]} */
function renderGantt(pane, rows, opts){
  const leftW = opts.leftW || 320;
  const height = rows.length * 34;
  const width = (RANGE_END - RANGE_START) * DAYW;
  pane.innerHTML = `<h2>${opts.title}</h2><div class="desc">${opts.desc||''}</div>${opts.legend||''}` +
    `<div class="gantt"><div class="g-left" style="flex-basis:${leftW}px"><div class="gl-head">${opts.leftHead||'工作项目'}</div>` +
    rows.map(r=>`<div class="gl-row ${r.cls||''} ${r.indent?'indent':''}" title="${(r.title||'').replace(/"/g,'&quot;')}">${r.label}</div>`).join('') +
    `</div><div class="g-right"><div class="gr" style="width:${width}px;position:relative">` +
    axisHTML(width) +
    `<div class="gr-body" style="position:relative;height:${height}px">` + weekendTodayHTML(height) + rowHTML(rows) + `</div>` +
    `</div></div></div>` + (opts.foot||'');
}

  });
  renderGantt(el, rows, {
    title:'② 瀑布/阶段式甘特图（串行阶段+评审关卡）',
    desc:'项目组排期主表，模板 8甘特表 的标准形态；阶段串行、每阶段有评审关卡。1-31 日天粒度 + 阶段/责任人/确认人/表单。',
    leftHead:'任务清单（阶段/工作项目）',
    legend:'<div class="legend"><span><i class="lg" style="background:var(--stage1)"></i>手板阶段</span><span><i class="lg" style="background:var(--stage2)"></i>模具阶段</span><span><i class="lg" style="background:var(--stage3)"></i>生产阶段</span><span><i class="lg" style="background:#333"></i>阶段总条</span><span><i class="lg" style="background:#eaf2fb"></i>周末/假日</span><span><i class="lg" style="background:#f56c6c"></i>今天</span></div>',
    foot:'<div class="foot">填表规则：计划时间=黑色；按时完成=绿色；延期完成=黄色；进行中预警=橙色；工作项目前加项目编号；假日列淡蓝标识。</div>'
  });
}

function pane2(el){
  const rows = [];
  SPRINTS.forEach(sp=>{
    rows.push({label:`${sp.code} ${sp.r} · ${sp.goal}`, cls:'stage', bars:[{s:sp.s,e:sp.e,cls:'track',text:sp.code,title:`${sp.code} ${sp.r} ${sp.goal}`}]});
    sp.tasks.forEach(tn=>{
      const t = TASKS.find(x=>x.n===tn);
      rows.push({label:`XM2026-001-${t.code} ${t.name}`, indent:true, title:t.ev, bars:[{s:t.s,e:t.e,cls:t.stage,text:`${t.s.slice(5)}~${t.e.slice(5)}`,title:`${t.name} · ${t.owner}`}]});
    });
  });
  renderGantt(el, rows, {
    title:'③ 迭代式甘特图（Sprint/双周迭代·需求多变时用）',
    desc:'需求不确定、电子/软件方案需反复验证时；每个迭代内是「设计-打样-测试」小循环。更新频率：每迭代站会。',
    leftHead:'迭代清单（Sprint Backlog）',
    legend:'<div class="legend"><span><i class="lg" style="background:#409eff"></i>迭代区间</span><span><i class="lg" style="background:var(--stage1)"></i>手板任务</span><span><i class="lg" style="background:var(--stage2)"></i>模具任务</span><span><i class="lg" style="background:var(--stage3)"></i>生产任务</span></div>',
    foot:'<div class="foot">说明：迭代式不等于砍掉阶段——把 21 项按双周切片后，仍要对齐阶段关卡与交付表单。</div>'
  });
}

function pane3(el){
  const rows = [];
  let cur='';
  TASKS.forEach(t=>{
    if(t.stage!==cur){
      cur=t.stage;
      rows.push({label:'■ '+STAGES[t.stage].name, cls:'stage', bars:[{s:t.s,e:t.e,cls:'dark',text:STAGES[t.stage].range}]});
    }
    const sp = SPRINTS.find(s=>s.tasks.includes(t.n));
    rows.push({label:`${sp?sp.code:'  '}　XM2026-001-${t.code} ${t.name}`, indent:true, title:t.ev, bars:[{s:t.s,e:t.e,cls:t.stage,text:`${t.s.slice(5)}~${t.e.slice(5)}`,title:`${sp?sp.code:''} ${t.name} · ${t.owner}\n${t.ev}`}]});
  });
  renderGantt(el, rows, {
    title:'④ 混合式甘特图（外层阶段 + 内层迭代嵌套）',
    desc:'复杂软硬件一体项目的主视图；外层管阶段关卡（模具/认证不放水），内层用迭代吸收需求变更。',
    leftHead:'阶段 / 迭代 / 任务（三层嵌套）',
    legend:'<div class="legend"><span><i class="lg" style="background:#333"></i>阶段总条</span><span><i class="lg" style="background:var(--stage1)"></i>手板</span><span><i class="lg" style="background:var(--stage2)"></i>模具</span><span><i class="lg" style="background:var(--stage3)"></i>生产</span></div>',
    foot:'<div class="foot">读法：先看阶段总条（能否按期出阶段成果），再看任务条（谁拖了），最后看证据列（表单齐不齐）。</div>'
  });
}

function pane4(el){
  const rows = [];
  TASKS.forEach(t=>{
    const pct = ACTUAL[t.n]||0;
    let cls='dark', label=`基准 ${t.s.slice(5)}~${t.e.slice(5)}`;
    rows.push({label:`XM2026-001-${t.code} ${t.name}　<span style="color:#909399">${t.owner} · ${pct===1?'已完成':pct>0?'进行中':'未开始'}</span>`, bars:[{s:t.s,e:t.e,cls:cls,text:label,title:`基准 ${t.s}~${t.e}`}]});
    if(pct>0){
      const done = pct===1;
      rows.push({label:`　└ 实际执行　${Math.round(pct*100)}%`, indent:true, bars:[{s:t.s, e: done ? t.e : TODAY, cls: done?'done':'ongoing', text:`实际 ${Math.round(pct*100)}%`, title:`实际执行 ${Math.round(pct*100)}%`}]});
    } else {
      rows.push({label:'　└ 实际执行　0%', indent:true});
    }
  });
  renderGantt(el, rows, {
    title:'⑤ 基准计划 vs 进度跟踪甘特图（实际 vs 基准·偏差预警）',
    desc:'周会跟进度，一眼看出谁延期、偏差几天、证据表单是否齐。更新频率：每周五下班前。',
    leftHead:'基准（上行）/ 实际（下行）',
    legend:'<div class="legend"><span><i class="lg" style="background:#333"></i>基准计划条</span><span><i class="lg" style="background:#67c23a"></i>实际·按时完成</span><span><i class="lg" style="background:#e6a23c"></i>实际·延期完成</span><span><i class="lg" style="background:#f56c6c"></i>实际·进行中/预警</span></div>',
    foot:'<div class="foot">表单标准：按时完成=绿色，延期完成=黄色，计划时间=黑色。偏差(天)=实际结束-基准结束，正数即延期。</div>'
  });
}

function pane5(el){
  // 计算每个角色每天的并行任务数
  const rows = ROLES.map((role, idx)=>{
    const bars = [];
    for(let d=RANGE_START; d<=RANGE_END; d++){
      const iso = new Date(d*DAY).toISOString().slice(0,10);
      const cnt = TASKS.filter(t=> t.owner===role && D(t.s)<=d && d<=D(t.e)).length;
      if(cnt>0) bars.push({s:iso,e:iso,cls:'h'+(cnt>=3?3:cnt===2?2:1),text:cnt>1?cnt:'',title:`${role} ${iso} 并行 ${cnt} 项`});
    }
    return {label:`${role}`, bars};
  });
  // 用 bar 替代 heat 显示
  const rows2 = rows.map(r=>({label:r.label, bars:r.bars.map(b=>({...b, cls: b.cls, text:b.text}))}));
  renderGantt(el, rows2, {
    title:'⑥ 资源/负荷甘特图（按角色看人力挤占）',
    desc:'研发项目人力是瓶颈，这张图看谁被塞满、哪周撞车。单元格数字=该角色当日并行执行的任务数。',
    leftHead:'负责人/角色',
    legend:'<div class="legend"><span><i class="lg" style="background:#67c23a"></i>并行1项(正常)</span><span><i class="lg" style="background:#e6a23c"></i>并行2项(饱和)</span><span><i class="lg" style="background:#f56c6c"></i>并行≥3项(过载)</span></div>',
    foot:'<div class="foot">本图暴露：结构工程师总占用 50 天、负荷率 54% 为最高；10/28-11/03 手板样品与模具图纸并行（峰值=2）是唯一撞车窗口。</div>'
  });
}

function pane6(el){
  const rows = TASKS.map(t=>{
    const dep = DEPS[t.n];
    const cp = dep.cp;
    return {label:`XM2026-001-${t.code} ${t.name}　<span style="color:#909399;font-size:11px">前置:${dep.pre} 浮动:${dep.float}${cp?'天  ★关键':''}</span>`, bars:[{s:t.s,e:t.e,cls: cp?'done':t.stage, text:cp?'★':`${t.s.slice(5)}~${t.e.slice(5)}`, title:`${t.name} · 前置 ${dep.pre} · 浮动 ${dep.float}天${cp?' · 关键路径':''}`}]};
  });
  renderGantt(el, rows, {
    title:'⑦ 依赖关系/关键路径甘特图（谁卡谁·技术风险视图）',
    desc:'识别「谁卡谁」——前置没完成，后面全部顺延；红色/绿色条=关键路径，动一天全项目动一天。',
    leftHead:'工作项目（前置任务/依赖类型/总浮动/关键路径）',
    legend:'<div class="legend"><span><i class="lg" style="background:#67c23a"></i>关键路径</span><span><i class="lg" style="background:var(--stage1)"></i>非关键(手板)</span><span><i class="lg" style="background:var(--stage2)"></i>非关键(模具)</span><span><i class="lg" style="background:var(--stage3)"></i>非关键(生产)</span></div>',
    foot:'<div class="foot">依赖类型：FS=完成-开始，SS=开始-开始+滞后天数。关键路径：01→02→03→04→08→09→10→11→13→16→18→19→20→21。</div>'
  });
}

/* 初始化 */
const TABS = ['①里程碑','②瀑布','③迭代','④混合','⑤基准vs跟踪','⑥资源负荷','⑦依赖关键路径'];
const PANES = [pane0,pane1,pane2,pane3,pane4,pane5,pane6];
const tabsEl = document.getElementById('tabs');
TABS.forEach((t,i)=>{
  const b = document.createElement('div');
  b.className='tab'+(i===0?' on':'');
  b.textContent=t;
  b.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    document.querySelectorAll('.pane').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    document.getElementById('pane-'+i).classList.add('on');
  };
  tabsEl.appendChild(b);
});
PANES.forEach((f,i)=>f(document.getElementById('pane-'+i)));
</script>
</body>
</html>

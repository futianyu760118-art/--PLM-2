function answerTool(text){let reply,source;if(/阶段|进度|项目/.test(text)){reply=`技转检查员：示例项目 ${p().projectNo} 当前阶段 ${p().currentGate}，状态 ${p().status}。未执行阶段门流转。`;source='本地 Project 示例对象'}else if(/BOM|引用|结构/i.test(text)){reply=pid===1?'结构助理：当前示例 BOM 包含 1 个总成与 6 个子项。实际 where-used 引用数量需由后端查询，本 DEMO 不伪造结果。':'结构助理：当前项目未提供示例 BOM。';source='本地 BOM 示例列表'}else if(/质量|料号|检查/.test(text)){reply='质检官：本 DEMO 未运行真实 DQ 检查，因此没有质量分或发布结论。正式系统需用已存在的料号调用检查工具。';source='能力边界说明'}else{reply='当前演示支持：项目阶段、BOM 引用说明、料号质量检查说明。这里是规则式工具助手，不能回答任意研发问题。';source='本地规则'}chat.push({role:'user',text},{role:'assistant',text:reply,source});page='tools';render()}

const handlers={nav:v=>{page=v;query='';render()},backworkspace:()=>{page='workspace';tab='overview';render()},tab:v=>{tab=v;render()},project:v=>{pid=Number(v);tab='overview';page='workspace';render()},personal:()=>{page='personal';render()},filter:v=>{filter=v;render()},task:taskModal,close:()=>$('#dialog').close(),gates,gatecheck:checkGate,doc:showDoc,part:partModal,partdocs:()=>{$('#dialog').close();page='evidence';render()},confirmcomplete:id=>{openModal('确认完成示例待办','<p>此操作仅更新当前浏览器内的示例工作项为 DONE。它不会调用后端，不会提交测试结果或通过评审。</p>',btn('确认完成','complete',id,'primary'))},complete:id=>{const t=state.tasks.find(x=>x.id===Number(id));if(t.status!=='DONE'){t.status='DONE';t.completedAt=new Date().toISOString();state.history.unshift({title:t.title+' → DONE（示例）',time:new Date().toLocaleString('zh-CN')});persist()}$('#dialog').close();render();notify('示例待办已完成，阶段门状态未改变')},quick:v=>answerTool(({stage:'查询当前项目阶段',bom:'查看 BOM 引用说明',quality:'检查料号质量'})[v]),mapping:mappingModal,release:()=>openModal('发布检查说明','<p>正式界面沿用 PUT /api/bom/{id}/release，由后端处理发布约束。本次不发送请求。</p><p>本地展示成本、查看资料不等于工程 BOM 已批准发布。</p>'),ecn:()=>openModal('ECN-DEMO-001 · 草稿','<p>示例变更：支架固定与档位结构调整。</p><div class="detail"><span>关联产品</span><b>DEMO-HS002</b><span>影响版本</span><b>结构 V0.6 / EBOM V0.6</b><span>准备资料</span><b>修改图纸、复测计划、相关工艺</b></div><div class="hint">影响范围为示例摘要，未执行真实影响分析。正式变更必须沿用原审批和生效流程。</div>'),modelpart:v=>{part=Number(v);render()},explode:()=>{exploded=!exploded;render()},rotate:()=>{angle+=30;render()},resetmodel:()=>{angle=-20;exploded=false;render()},modelinfo:()=>openModal('三维能力边界','<p>现有仓库有 Three.js 查看器，支持 GLB/glTF 在线预览、旋转、线框、剖切和视觉爆炸。</p><p>本文件为了完全离线且不加载依赖，使用 CSS 外观示意，只验证界面布局与关联操作。</p><p>后端 explode 接口当前检查算法健康后写入固定结果，不能认定已实现真实模型解析与自动 BOM 提取。格式转换还有部署环境依赖，需单独验证。</p>'),note:()=>openModal('本地模型评审意见',`<p>对象：${part===0?'主壳与透镜':'后盖与支架'} · ${p().partNo}</p><textarea id="noteInput" class="input" placeholder="例如：核对支架闭合空间与磁铁固定方式" maxlength="1000"></textarea><p>只作为本地意见草稿，不是三维位置批注。</p>${state.notes.filter(n=>n.pid===pid).map(n=>`<div class="lineitem">${esc(n.text)}<small>${esc(n.time)}</small></div>`).join('')}`,btn('保存意见草稿','savenote','','primary')),savenote:()=>{const text=$('#noteInput').value.trim();if(!text){notify('请填写评审意见');return}state.notes.push({pid,text,time:new Date().toLocaleString('zh-CN')});persist();$('#dialog').close();notify('意见草稿已保存在当前浏览器')},past:()=>openModal('研发资料周报 · 示例',`<p>统计范围：示例项目 ${p().projectNo}。非实际经营报告。</p><div class="detail"><span>当前阶段</span><b>${p().currentGate}</b><span>项目未完成待办</span><b>${opentasks().length}</b><span>资料情况</span><b>${docrows().length} 条示例摘要</b></div><p>结论：需根据真实测试、评审记录和发布包判断项目状态，不能从演示推断工程可行性。</p>`),about:()=>openModal('研发自治中心 · 前端方案 V2.0','<p>本版根据 --PLM-2 仓库的前端 API 封装、Project / WorkItem 字段与关键控制器设计，展示现有后端不变时的界面组织方式。</p><div class="choice"><b>建议体验顺序</b><p>① 产品概览 → ② 查看待办并完成示例 → ③ 查看阶段门 → ④ BOM / 工作表 / 证据 → ⑤ 岗位微系统 → ⑥ 工具查询。</p></div><p>所有项目、料号、人员、日期、金额、任务和资料均为示例；没有联网读取数据库或修改仓库。</p><p>桌面浏览器可直接打开。操作保存在当前浏览器；不同浏览器的数据彼此独立。该单文件是交互原型，正式系统应在原 Vue 工程中组件化实现。</p>',btn('接口对应','mapping')+btn('重置演示','confirmreset','','dangerbtn')),confirmreset:()=>openModal('重置演示数据','<p>将清除本文件保存的任务完成状态、处理记录和评审意见草稿。</p>',btn('确认重置','reset','','dangerbtn')),reset:()=>{state=structuredClone(seed);chat=[];persist();$('#dialog').close();render();notify('已重置为初始示例数据')}};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el){const h=handlers[el.dataset.act];if(h)h(el.dataset.value)}});document.addEventListener('submit',e=>{if(e.target.id==='chatForm'){e.preventDefault();const text=$('#chatInput').value.trim();if(text)answerTool(text)}});document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;const pos=e.target.selectionStart;render();const input=$('#search');input.focus();input.setSelectionRange(pos,pos)}});$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog')){$('#dialog').close()}});
let mode='product',professionalView='action',collabView='cards',projectFilter='all';
try{const pref=JSON.parse(localStorage.getItem('hj-plm-ui-v3-preference')||'{}');if(['classic','product','professional','collab','multica'].includes(pref.mode))mode=pref.mode;if(['action','engineering','canvas'].includes(pref.professionalView))professionalView=pref.professionalView}catch{}

function classicProjects(){const rows=projects.filter(x=>(x.projectName+x.projectNo).toLowerCase().includes(query.toLowerCase()));return `<div class="breadcrumb">研发自治中心 / 项目列表</div>${title('研发项目','经典表格模式 · 基于仓库 Project 字段展示')}<div class="card"><div class="sectiontop"><input class="input" id="search" style="max-width:350px" value="${esc(query)}" placeholder="项目名称 / 编号"><span class="sub">共 ${rows.length} 条</span></div>${table(['项目编号','项目名称','料号','负责人','阶段','计划完成','风险','操作'],rows.map(x=>tr([x.projectNo,x.projectName,x.partNo,x.owner,x.currentGate,x.targetDate,tag(x.riskLevel,x.riskLevel==='高'?'bad':'warn'),btn('详情','project',x.id,'link')])))}<p class="sub" style="margin-top:18px">第 1 页 / 共 1 页 · 示例数据</p></div>`}

function professionalWorkspace(){const heading=`<div class="breadcrumb">专业视图集 / ${p().projectNo}</div>${title('研发专业视图',p().projectName,btn('切换项目','nav','projects'))}${profTabs()}`;if(professionalView==='engineering')return heading+`<div class="viewdesc"><b>工程评审：</b>定位产品外观与关联资料，评审意见保存在本地。正式系统复用已有 Three.js 组件。</div>`+models();if(professionalView==='canvas')return heading+`<div class="viewdesc"><b>工具任务画布：</b>围绕现有工作项、规则工具和证据进行处理。没有接入通用大模型或自动设计服务。</div><div class="grid layout"><div>${tools()}</div><section class="card"><h2>当前项目行动</h2>${opentasks().map(t=>`<div class="lineitem"><b>${esc(t.title)}</b><small>${t.itemNo}</small>${btn('查看任务','task',t.id,'link')}</div>`).join('')||'<p>无未完成示例任务</p>'}${btn('查看关联证据','nav','evidence','full')}</section></div>`;return heading+`<div class="viewdesc"><b>岗位行动：</b>这里是研发中心内当前项目的行动视图；左下角“岗位微系统”按人员筛选，展示个人待办与报告。</div><div class="grid twocol"><section class="card"><div class="sectiontop"><h2>未来的待办</h2>${tag(p().currentGate)}</div>${opentasks().map(t=>`<div class="taskrow"><div>${tag('P'+t.priority,t.priority===1?'bad':'warn')}<h3 style="margin-top:10px">${esc(t.title)}</h3><p>${esc(t.itemNo)} · 截止 ${t.slaDueAt.slice(0,10)}</p>${tag(t.status,t.status==='ESCALATED'?'bad':'warn')}</div>${btn('处理任务 →','task',t.id)}</div>`).join('')||'<div class="empty">本项目示例待办已完成</div>'}</section><section class="card"><h2>过去的报告与资料</h2>${docrows().map(x=>`<div class="report"><h3>${x.title}</h3><p>${x.version} · ${x.status}</p>${btn('查看','doc',x.id,'link')}</div>`).join('')||'<div class="empty">暂无示例资料</div>'}<h3 style="margin-top:20px">本地处理记录</h3>${state.history.filter(h=>h.projectId===pid).map(h=>`<div class="lineitem">${esc(h.title)}<small>${esc(h.time)}</small></div>`).join('')||'<p class="sub">暂无本项目的新处理记录</p>'}</section></div>`}

const lessons=[
{title:'01 快速上手与五种界面',minutes:5,body:`<p>这是一份灯具制造企业 PLM 前端交互原型。五种模式组织同一份示例数据，不是五套独立系统。</p><h3>五种模式怎么选</h3>${table(['模式','适合做什么'],[['原版业务','用表格查阅项目与现有模块'],['产品工作空间','围绕一个产品查看跨专业资料'],['专业视图集','处理岗位行动、工程评审和工具查询'],['项目协同','查看项目卡片、任务看板及截止时间线'],['Multica 风格','用紧凑工作项列表组织人与工具协作']].map(tr))}<h3>第一次使用</h3><ol><li>在顶部选择界面模式。</li><li>进入“研发项目”并选择产品，确认项目编号和料号。</li><li>查看任务、BOM、资料和当前阶段。</li><li>切换另一种模式，确认仍是同一个项目。</li></ol><div class="lessonstep"><b>练习</b><p>打开 HS002，再切换项目协同和 Multica 风格。确认项目编号与待办数量一致。</p></div>`,target:'workspace'},
{title:'02 项目、料号与版本',minutes:6,body:`<p>项目编号用于组织研发活动；料号用于关联物料、BOM、模型与档案。它们不能互相替代。</p><h3>查看资料前核对</h3><ol><li>项目与产品是否正确。</li><li>图纸、BOM、模型、样机与测试记录分别是什么版本。</li><li>资料是草稿、待评审还是已发布。</li><li>关联证据是否针对当前版本。</li></ol><p>例如，结构 V0.6、EBOM V0.6 与样机 S03 是不同对象的版本标识，名称相近并不证明已经一致。</p><div class="lessonstep"><b>练习</b><p>打开 BOM 的主壳体详情，再查看关联资料。记下需要进一步核对的版本关系。</p></div><div class="readnotice">本 DEMO 的物料、版本与金额为示例，不是生产数据库中的受控记录。</div>`,target:'bom'},
{title:'03 待办处理与阶段评审',minutes:7,body:`<p>未来的待办告诉执行者需要处理的事项。过去的报告保留交付结果与证据。</p><h3>处理一项待办</h3><ol><li>阅读工作目标、负责人、优先级、截止时间与关联对象。</li><li>核对输入资料和需要交付的内容。</li><li>完成实际工作，整理验证结果与证据。</li><li>本 DEMO 中点击“完成示例待办”，只将本地工作项置为 DONE。</li><li>返回产品阶段门，确认阶段不会随待办完成自动通过。</li></ol><h3>三种状态</h3>${table(['状态','含义'],[['OPEN','待处理'],['ESCALATED','已升级，需关注'],['DONE','工作项完成']].map(tr))}<div class="readnotice">待办完成不等于测试合格、评审批准或阶段门通过。正式系统中的工序待办可能触发后续流程，实施时须沿用后端约束。</div><div class="lessonstep"><b>练习</b><p>完成一条示例任务，切换两种界面确认同步，再查看阶段门记录。</p></div>`,target:'workspace'},
{title:'04 BOM、工作表与证据',minutes:7,body:`<p>BOM 描述产品结构；工作表记录业务过程；证据支持判断与追溯。新界面聚合它们，不创建重复主数据。</p><h3>资料查看路径</h3><ol><li>进入 BOM，查看组成、数量和版本。</li><li>进入研发工作表，查看规格、配置、样品、评审、测试与试产记录。</li><li>进入证据台账，查看来源、关联对象和资料摘要。</li><li>判断证据是否充分；无数据时保持未提供或待验证。</li></ol><h3>灯具研发重点</h3><p>光学与温升、电气与电池、磁铁固定、支架结构、维护性及可靠性都需要对应的验证条件和结果。本演示没有真实检测报告。</p><div class="lessonstep"><b>练习</b><p>查看温升记录摘要，识别为什么当前不能给出合格结论。</p></div>`,target:'evidence'},
{title:'05 从立项到产品退市',minutes:8,body:`<p>产品生命周期持续到在产维护、售后反馈、停产、退市和归档。研发工作不会在量产移交时结束。</p><h3>完整业务链路</h3><p>${life.map(x=>x[0]).join(' → ')}</p><h3>需要理解的边界</h3><ol><li>生命周期展示模型与 G0–G8 阶段门是两套不同用途的表达，不可自行一一映射。</li><li>工程变更贯穿多阶段，售后反馈可以触发重新设计与验证。</li><li>停产和退市需检查订单、库存、供应、渠道、备件和服务安排。</li><li>退市后保留追溯与持续义务，不能简单删除产品。</li></ol><div class="lessonstep"><b>练习</b><p>打开“产品退市”，查看哪些资料需要准备，以及哪些能力尚未接入后端。</p></div>`,target:'lifecycle'},
{title:'06 工具、权限与个人设置',minutes:6,body:`<h3>工具助手</h3><p>当前示例为规则式工具查询。Multica 风格只借鉴呈现方式；没有自动 Agent 执行引擎。空白运行记录不能显示为已执行成功。</p><h3>权限</h3><p>配置中心中的勾选项是本地草稿，不会改变真实接口权限。切换界面或颜色，也不会提高用户权限。</p><h3>配色与密度</h3><ol><li>点击顶部“外观配色”。</li><li>选择预设或自定义强调色。</li><li>选择侧栏跟随模式、浅色或深色。</li><li>选择舒适或紧凑密度；设置自动保存在当前浏览器。</li></ol><h3>数据与保存</h3><p>离线操作保存在当前浏览器。不同电脑、浏览器或文件打开方式可能无法共享记录；清理浏览器数据会丢失本地进度。当前没有服务端同步。</p><div class="lessonstep"><b>练习</b><p>修改颜色后切换五种界面，确认布局保留且强调色一致；再恢复默认外观。</p></div>`,target:'tools'}];
const faq=[['如何打开？','下载 HTML 文件后用 Edge 或 Chrome 打开。若看到代码预览，先保存文件，再从电脑打开；不需要启动后端。'],['五种界面切换后数据是否一致？','项目、任务和资料共用一份本地示例数据。不同模式只改变导航与排版，当前项目会保留。'],['为什么完成任务后阶段没有通过？','工作项完成与工程评审是独立流程。阶段门通过需要资料、证据、业务规则与授权人员的结论。'],['为什么模型不是真实 CAD？','离线 DEMO 使用外观示意；正式系统可复用已有 GLB/glTF 查看器。它不能替代工程模型、碰撞检查或仿真。'],['能否自动派发给 Multica Agent？','此版没有集成 Multica 运行时，工作项草稿不会创建真实执行任务。'],['权限配置是否会生效？','不会。配置中心只是本地权限交互草稿，正式授权必须由后端校验。'],['如何查看退市流程？','点击全生命周期，选择停产评估、产品退市和归档；尚未接入的环节会明确标注。'],['颜色可以自选吗？','点击外观配色，选择预设或自定义强调色，侧栏可跟随布局、浅色或深色。'],['学习进度在哪里？','学习中心按章节标记已读，进度保存在当前浏览器。已读标记不是能力认证或考试结果。'],['如何恢复初始状态？','方案对照中可以重置示例业务数据；外观面板中恢复默认配色；学习中心可单独重置阅读进度。三者独立。']];
let lessonIndex=0,helpQuery='',tourIndex=0;let readLessons=[];try{readLessons=JSON.parse(localStorage.getItem('hj-plm-learning-v6')||'[]');if(!Array.isArray(readLessons))readLessons=[]}catch{}
let appearance={accent:'#2060f3',sidebar:'mode',density:'comfortable'};try{const a=JSON.parse(localStorage.getItem('hj-plm-appearance-v6')||'{}');if(/^#[0-9a-f]{6}$/i.test(a.accent||''))appearance.accent=a.accent;if(['mode','light','dark'].includes(a.sidebar))appearance.sidebar=a.sidebar;if(['comfortable','compact'].includes(a.density))appearance.density=a.density}catch{}
const palettes=[['科技蓝','#2060f3'],['松石青','#137d83'],['森林绿','#25825b'],['琥珀橙','#c56b19'],['紫罗兰','#7656bb'],['石墨灰','#525b69']];
function luminance(hex){const a=hex.slice(1).match(/../g).map(x=>parseInt(x,16)/255).map(x=>x<=.04045?x/12.92:((x+.055)/1.055)**2.4);return .2126*a[0]+.7152*a[1]+.0722*a[2]}
function applyAppearance(){const hex=appearance.accent,rgb=hex.slice(1).match(/../g).map(x=>parseInt(x,16)),darkText=luminance(hex)>.18?'#182333':hex;document.body.dataset.palette=hex;document.body.dataset.sidebar=appearance.sidebar;document.body.dataset.density=appearance.density;document.body.style.setProperty('--blue',hex);document.body.style.setProperty('--accent-soft','rgb('+rgb.join(' ')+ ' / 0.11)');document.body.style.setProperty('--accent-text',darkText);document.body.style.setProperty('--on-accent',luminance(hex)>.179?'#172334':'#ffffff');try{localStorage.setItem('hj-plm-appearance-v6',JSON.stringify(appearance))}catch{}}
function appearanceModal(){openModal('外观与配色',`<p>强调色跨五种界面生效；异常、警告和成功仍保持独立语义颜色。</p><label>预设配色</label><div class="palettegrid">${palettes.map(([name,color])=>btn(`<span class="colorswatch" style="background:${color}"></span>${name}`,'palette',color,'paletteoption '+(appearance.accent===color?'current':''))).join('')}</div><label for="customColor">自定义强调色</label><input id="customColor" type="color" value="${appearance.accent}" aria-label="自定义强调色"><span class="sub" style="margin-left:10px">${appearance.accent}</span><label for="sidebarTheme">侧栏底色</label><select id="sidebarTheme" class="input">${[['mode','跟随界面模式'],['light','浅色侧栏'],['dark','深色侧栏']].map(([v,l])=>`<option value="${v}" ${appearance.sidebar===v?'selected':''}>${l}</option>`).join('')}</select><label for="densitySetting">信息密度</label><select id="densitySetting" class="input">${[['comfortable','舒适'],['compact','紧凑']].map(([v,l])=>`<option value="${v}" ${appearance.density===v?'selected':''}>${l}</option>`).join('')}</select><div class="appearancepreview"><button class="primary" disabled>主操作示例</button>${tag('一般状态')}${tag('待处理','warn')}${tag('异常','bad')}</div><p class="sub">设置即时保存于本浏览器，不影响其他成员或后端。</p>`,btn('恢复默认外观','resetAppearance'))}
function learningPage(){const lesson=lessons[lessonIndex];return `<div class="breadcrumb">帮助与学习 / ${p().projectNo}</div><div class="learninghead">${title('系统学习中心','按实际操作路径学习 · 6 章教材 · 可打印为 PDF')}<div class="actions">${btn('使用说明','help')}${btn('新手引导','tour')}</div></div><div class="sectiontop"><span class="sub">已读 ${readLessons.length} / ${lessons.length} 章（阅读标记，非能力认证）</span>${btn('重置学习进度','confirmLearningReset','','link')}</div><div class="courseprogress"><span style="width:${readLessons.length/lessons.length*100}%"></span></div><div class="grid learninglayout"><section class="card lessonnav">${lessons.map((l,i)=>btn((readLessons.includes(i)?'✓ ':'')+l.title,'lesson',i,lessonIndex===i?'current':'')).join('')}</section><article class="card lessonarticle"><div class="learningmeta">约 ${lesson.minutes} 分钟 · ${readLessons.includes(lessonIndex)?'已标记阅读':'尚未标记阅读'} · 教材 V1.0</div><h2>${lesson.title}</h2>${lesson.body}<div class="actions">${btn(readLessons.includes(lessonIndex)?'取消已读':'标记本章已读','readLesson','','primary')}${btn('去页面练习','lessonPractice',lesson.target)}${btn('打印 / 保存 PDF','printLesson')}${lessonIndex<lessons.length-1?btn('下一章 →','lesson',lessonIndex+1):''}</div></article></div>`}
function helpPage(){const items=faq.filter(x=>x.join('').includes(helpQuery));return `<div class="breadcrumb">帮助 / 系统使用说明</div>${title('系统使用说明','适用于五界面交互 DEMO V6 · 真实系统上线后需同步更新说明')}<div class="quickhelp">${btn('进入学习教材','learning','','primary')}${btn('启动新手引导','tour')}${btn('选择界面颜色','appearance')}</div><input id="helpSearch" class="input helpsearch" placeholder="搜索说明，例如：任务、退市、颜色" value="${esc(helpQuery)}"><section class="card">${items.map(([q,a])=>`<div class="helpfaq"><h3>${q}</h3><p>${a}</p></div>`).join('')||'<div class="empty">没有匹配说明，请换个关键词</div>'}</section>`}
const tour=[['选择界面模式','顶部有五种界面。先选熟悉的布局，切换不会更换当前项目。','workspace'],['确认项目与料号','先进入项目列表，选中产品，核对项目编号与料号。','projects'],['查看并处理工作项','阅读任务要求和关联资料。完成示例待办后，阶段门不会自动通过。','workspace'],['查看受控资料','核对 BOM、图纸、样机与证据版本。空白资料不能当作验证通过。','evidence'],['查看完整生命周期','查看量产后的维护、反馈、停产、退市和归档。规划入口不代表已接入。','lifecycle'],['学习与个性化','打开教材学习，再在外观面板选择颜色、侧栏底色与密度。','learning']];
function showTour(){const t=tour[tourIndex];page=t[2];render();openModal('新手引导',`<div class="tutorialcounter">第 ${tourIndex+1} 步 / 共 ${tour.length} 步</div><h2>${t[0]}</h2><p>${t[1]}</p><div class="hint">关闭引导后可操作当前页面；可从“使用说明”再次启动。</div>`,(tourIndex?btn('上一步','tourPrevious'):'')+btn(tourIndex===tour.length-1?'完成引导':'下一步','tourNext','','primary'))}
const beforeLearningRender=render;render=function(){const target=page;if(['learning','help'].includes(target)){page='projects';beforeLearningRender();page=target;$('#app').innerHTML=modeBar()+lifecycleStrip()+(target==='learning'?learningPage():helpPage());renderSideNav()}else beforeLearningRender();applyAppearance()};
const beforeLearningSide=renderSideNav;renderSideNav=function(){beforeLearningSide();$('.asidefoot').innerHTML+='<div class="themefooter">'+btn('使用说明','help','','railfootbutton')+btn('学习中心','learning','','railfootbutton')+btn('外观配色','appearance','','railfootbutton')+'</div>'};
const previousModeBar=modeBar;modeBar=function(){return previousModeBar()+`<div class="quickhelp">${btn('使用说明','help')}${btn('学习教材','learning')}${btn('外观配色','appearance')}</div>`};
handlers.appearance=appearanceModal;handlers.palette=color=>{if(!/^#[0-9a-f]{6}$/i.test(color))return;appearance.accent=color;applyAppearance();appearanceModal()};handlers.resetAppearance=()=>{appearance={accent:'#2060f3',sidebar:'mode',density:'comfortable'};applyAppearance();appearanceModal()};handlers.learning=()=>{page='learning';render()};handlers.help=()=>{page='help';render()};handlers.lesson=v=>{lessonIndex=Number(v);page='learning';render()};handlers.readLesson=()=>{readLessons=readLessons.includes(lessonIndex)?readLessons.filter(i=>i!==lessonIndex):[...readLessons,lessonIndex];try{localStorage.setItem('hj-plm-learning-v6',JSON.stringify(readLessons))}catch{}render()};handlers.lessonPractice=v=>{if(v==='lifecycle'){lifeStage=10;page='lifecycle'}else page=v;render()};handlers.printLesson=()=>window.print();handlers.confirmLearningReset=()=>openModal('重置学习进度','<p>仅清除教材的已读标记，不改变业务示例、界面配色或草稿。</p>',btn('确认重置','resetLearning','','primary'));handlers.resetLearning=()=>{readLessons=[];try{localStorage.removeItem('hj-plm-learning-v6')}catch{}$('#dialog').close();render()};handlers.tour=()=>{tourIndex=0;showTour()};handlers.tourNext=()=>{if(tourIndex===tour.length-1){$('#dialog').close();notify('引导完成，可继续学习教材')}else{tourIndex++;showTour()}};handlers.tourPrevious=()=>{tourIndex=Math.max(0,tourIndex-1);showTour()};
document.addEventListener('input',e=>{if(e.target.id==='customColor'&&/^#[0-9a-f]{6}$/i.test(e.target.value)){appearance.accent=e.target.value;applyAppearance()}if(e.target.id==='helpSearch'){helpQuery=e.target.value;const pos=e.target.selectionStart;render();const input=$('#helpSearch');input.focus();input.setSelectionRange(pos,pos)}});document.addEventListener('change',e=>{if(e.target.id==='sidebarTheme'){appearance.sidebar=e.target.value;applyAppearance()}if(e.target.id==='densitySetting'){appearance.density=e.target.value;applyAppearance()}});

let latestTaskId=null;const legacyTask=handlers.task;handlers.task=id=>{latestTaskId=id;legacyTask(id)};
function contrast(a,b){const x=luminance(a),y=luminance(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
const previousAppearance=applyAppearance;applyAppearance=function(){previousAppearance();let hex=appearance.accent;let [r,g,b]=hex.slice(1).match(/../g).map(x=>parseInt(x,16));const soft='#'+[r,g,b].map(x=>Math.round(x*.11+255*.89).toString(16).padStart(2,'0')).join('');let text=hex;for(let i=0;i<25&&contrast(text,soft)<4.5;i++){text='#'+text.slice(1).match(/../g).map(x=>Math.round(parseInt(x,16)*.88).toString(16).padStart(2,'0')).join('')}document.body.style.setProperty('--accent-text',text);document.body.style.setProperty('--accent-soft',soft);const white=contrast(hex,'#ffffff'),dark=contrast(hex,'#000000');document.body.style.setProperty('--on-accent',white>=dark?'#ffffff':'#000000')};
function normalizeControls(){document.querySelectorAll('input,select,textarea').forEach((el,i)=>{const labels={search:'搜索项目名称或项目编号',projectFilter:'筛选项目风险',tbFilter:'筛选任务范围',prompt:'研发目标',noteInput:'模型评审意见',taskDraft:'任务处理说明',lifeDraft:'生命周期规划意见',issueDraft:'工作项草稿',helpSearch:'搜索使用说明',chatInput:'工具查询内容',customColor:'自定义强调色',sidebarTheme:'侧栏底色',densitySetting:'信息密度',roleName:'角色名称'};if(!el.name)el.name=el.id||'field-'+i;if(!el.hasAttribute('autocomplete'))el.setAttribute('autocomplete','off');if(el.type!=='checkbox'&&!el.labels?.length&&!el.hasAttribute('aria-label'))el.setAttribute('aria-label',labels[el.id]||el.placeholder||'输入内容');if(el.id==='search'||el.id==='chatInput')el.spellcheck=false});document.querySelectorAll('[data-act="close"]').forEach(el=>{if(el.textContent.trim()==='×')el.setAttribute('aria-label','关闭对话框')});document.querySelectorAll('.navico').forEach(el=>el.setAttribute('aria-hidden','true'));document.querySelectorAll('button').forEach(el=>{if(!el.hasAttribute('type')&&!el.closest('#chatForm'))el.type='button'});}
const currentRender=render;render=function(){currentRender();normalizeControls()};const currentModal=openModal;openModal=function(title,body,foot=''){currentModal(title,body,foot);normalizeControls();$('#dialog').setAttribute('aria-labelledby','dialogTitle')};
const originalSideEntry=sideEntry;sideEntry=function(id,icon,label,active,count){const map={projects:'projects',tasks:'tasks',workspace:'board',overview:'board',requirements:'tasks',structure:'board',bom:'files',models:'board',changes:'tasks',evidence:'files',sheets:'files',tools:'tools',agents:'tools',personal:'tasks',gates:'timeline',lifecycle:'timeline',skills:'files',runs:'timeline',action:'tasks',engineering:'board',canvas:'tools',files:'files',timeline:'timeline',board:'board'};return originalSideEntry(id,icon.includes('<svg')?icon:svgIcon(map[id]||'files'),label,active,count)};
const baseModeBar=modeBar;modeBar=function(){return baseModeBar()+`<div class="toolbaraccess">${btn('查看本版检查记录','audit','','link')}</div>`};

function stashDraft(el){if(!el?.id)return;const value=el.value;if(el.id==='taskDraft'&&latestTaskId){state.taskDrafts=state.taskDrafts||{};state.taskDrafts[latestTaskId]=value;persist()}if(el.id==='noteInput'){state.uiReviewDraft={pid,text:value};persist()}if(el.id==='lifeDraft'){state.lifeDrafts=state.lifeDrafts||{};state.lifeDrafts[pid+'-'+lifeStage]=value;persist()}if(el.id==='issueDraft'){state.uiIssueDraft={pid,text:value};persist()}}

const appearanceBeforeBackground=appearanceModal;appearanceModal=function(){appearanceBeforeBackground();const group=document.createElement('section');group.className='settingsgroup';group.innerHTML=`<h3>页面底色</h3><p class="sub">只调整工作区底色，资料卡片保持浅色；与强调色、侧栏底色分别设置。</p><div class="backgroundoptions">${backgroundPresets.map(([name,color])=>btn(`<span class="bgchip" style="background:${color}"></span>${name}`,'background',color,appearance.background===color?'current':'')).join('')}</div><label for="customBackground">自定义页面底色</label><input id="customBackground" name="customBackground" type="color" value="${appearance.background}" aria-label="自定义页面底色"><span class="backgroundcode" id="backgroundCode">${appearance.background}</span><p class="formhint">设置即时保存，切换五种模式后保留。深石墨为页面底色预设，不是全站暗色模式。</p>`;$('.modalbody').appendChild(group);normalizeControls()};handlers.appearance=appearanceModal;handlers.background=color=>{if(!/^#[0-9a-f]{6}$/i.test(color))return;appearance.background=color;applyAppearance();appearanceModal()};handlers.resetAppearance=()=>{appearance={accent:'#2060f3',sidebar:'mode',density:'comfortable',background:'#f4f7fc'};applyAppearance();appearanceModal()};
document.addEventListener('input',e=>{if(e.target.id==='customBackground'&&/^#[0-9a-f]{6}$/i.test(e.target.value)){appearance.background=e.target.value;applyAppearance();$('#backgroundCode').textContent=e.target.value}});

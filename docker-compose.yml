volumes:
  postgres_data:
  redis_data:
  plm_files:

networks:
  plm-network:
    driver: bridge

services:
  # ============ PostgreSQL ============
  postgres:
    image: postgres:15-alpine
    container_name: plm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: plm_v4
      POSTGRES_USER: plm
      POSTGRES_PASSWORD: plm@123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/00_ltree.sql:/docker-entrypoint-initdb.d/00_ltree.sql:ro
      - ./database/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/02_seed_data.sql:/docker-entrypoint-initdb.d/02_seed_data.sql:ro
      - ./database/03_schema_extend.sql:/docker-entrypoint-initdb.d/03_schema_extend.sql:ro
      - ./database/04_share_link.sql:/docker-entrypoint-initdb.d/04_share_link.sql:ro
      - ./database/05_fix_deleted.sql:/docker-entrypoint-initdb.d/05_fix_deleted.sql:ro
      - ./database/06_fix_bom_item.sql:/docker-entrypoint-initdb.d/06_fix_bom_item.sql:ro
      - ./database/10_v1_1_lean_agent_kpi.sql:/docker-entrypoint-initdb.d/10_v1_1_lean_agent_kpi.sql:ro
      - ./database/11_wave0_part_lifecycle.sql:/docker-entrypoint-initdb.d/11_wave0_part_lifecycle.sql:ro
      - ./database/12_waves1_6_bom_ecn_export.sql:/docker-entrypoint-initdb.d/12_waves1_6_bom_ecn_export.sql:ro
      - ./database/13_dq_rules_webhook.sql:/docker-entrypoint-initdb.d/13_dq_rules_webhook.sql:ro
      - ./database/13_archive_param_templates.sql:/docker-entrypoint-initdb.d/13_archive_param_templates.sql:ro
      - ./database/14_bom_cbom_cost.sql:/docker-entrypoint-initdb.d/14_bom_cbom_cost.sql:ro
      - ./database/15_insight_generation.sql:/docker-entrypoint-initdb.d/15_insight_generation.sql:ro
      - ./database/16_project_npi.sql:/docker-entrypoint-initdb.d/16_project_npi.sql:ro
      - ./database/17_agent_session_seq.sql:/docker-entrypoint-initdb.d/17_agent_session_seq.sql:ro
      - ./database/17_analytics_seed.sql:/docker-entrypoint-initdb.d/17_analytics_seed.sql:ro
      - ./database/18_dq_rules_strengthened.sql:/docker-entrypoint-initdb.d/18_dq_rules_strengthened.sql:ro
      - ./database/19_dq_auto_fix.sql:/docker-entrypoint-initdb.d/19_dq_auto_fix.sql:ro
      - ./database/20_ux_enhancements.sql:/docker-entrypoint-initdb.d/20_ux_enhancements.sql:ro
      - ./database/21_enum_fix.sql:/docker-entrypoint-initdb.d/21_enum_fix.sql:ro
      - ./database/22_process_flow.sql:/docker-entrypoint-initdb.d/22_process_flow.sql:ro
      - ./database/23_project_initiation.sql:/docker-entrypoint-initdb.d/23_project_initiation.sql:ro
      - ./database/24_project_progress.sql:/docker-entrypoint-initdb.d/24_project_progress.sql:ro
      - ./database/25_node_evidence_text.sql:/docker-entrypoint-initdb.d/25_node_evidence_text.sql:ro
      - ./database/26_m04_sync_hub.sql:/docker-entrypoint-initdb.d/26_m04_sync_hub.sql:ro
      - ./database/27_node_sheet_map.sql:/docker-entrypoint-initdb.d/27_node_sheet_map.sql:ro
      - ./database/28_rd_worksheets.sql:/docker-entrypoint-initdb.d/28_rd_worksheets.sql:ro
      - ./database/29_plan_and_master.sql:/docker-entrypoint-initdb.d/29_plan_and_master.sql:ro
      - ./database/30_project_changelog.sql:/docker-entrypoint-initdb.d/30_project_changelog.sql:ro
      - ./database/31_basebom_specs.sql:/docker-entrypoint-initdb.d/31_basebom_specs.sql:ro
      - ./database/32_aeos_envelope.sql:/docker-entrypoint-initdb.d/32_aeos_envelope.sql:ro
      - ./database/33_code_issue_rule_code.sql:/docker-entrypoint-initdb.d/33_code_issue_rule_code.sql:ro
      - ./database/34_fix_deleted_default.sql:/docker-entrypoint-initdb.d/34_fix_deleted_default.sql:ro
      - ./database/35_initiation_text_columns.sql:/docker-entrypoint-initdb.d/35_initiation_text_columns.sql:ro
      - ./database/36_ebms_users_roles.sql:/docker-entrypoint-initdb.d/36_ebms_users_roles.sql:ro
      - ./database/37_feedback.sql:/docker-entrypoint-initdb.d/37_feedback.sql:ro
      - ./database/38_feedback_transition.sql:/docker-entrypoint-initdb.d/38_feedback_transition.sql:ro
      - ./database/39_ebms_migration.sql:/docker-entrypoint-initdb.d/39_ebms_migration.sql:ro
      - ./database/40_permission_seq_fix.sql:/docker-entrypoint-initdb.d/40_permission_seq_fix.sql:ro
      - ./database/41_login_log.sql:/docker-entrypoint-initdb.d/41_login_log.sql:ro
      - ./database/42_m04_autonomy_slice2.sql:/docker-entrypoint-initdb.d/42_m04_autonomy_slice2.sql:ro
      - ./database/43_m04_decision_loop.sql:/docker-entrypoint-initdb.d/43_m04_decision_loop.sql:ro
      - ./database/44_feedback_v2.sql:/docker-entrypoint-initdb.d/44_feedback_v2.sql:ro
      - ./database/45_ledger.sql:/docker-entrypoint-initdb.d/45_ledger.sql:ro
      - ./database/46_subscription.sql:/docker-entrypoint-initdb.d/46_subscription.sql:ro
      - ./database/47_permission_seed_repair.sql:/docker-entrypoint-initdb.d/47_permission_seed_repair.sql:ro
      - ./database/48_data_scope.sql:/docker-entrypoint-initdb.d/48_data_scope.sql:ro
      - ./database/49_skill.sql:/docker-entrypoint-initdb.d/49_skill.sql:ro
      - ./database/50_org_dept_assign.sql:/docker-entrypoint-initdb.d/50_org_dept_assign.sql:ro
      - ./database/51_knowledge.sql:/docker-entrypoint-initdb.d/51_knowledge.sql:ro
      - ./database/52_ebms_sync.sql:/docker-entrypoint-initdb.d/52_ebms_sync.sql:ro
      - ./database/53_ebms_nodes_gates.sql:/docker-entrypoint-initdb.d/53_ebms_nodes_gates.sql:ro
      - ./database/54_fix_22_nodes.sql:/docker-entrypoint-initdb.d/54_fix_22_nodes.sql:ro
      - ./database/55_agent_memory.sql:/docker-entrypoint-initdb.d/55_agent_memory.sql:ro
      - ./database/56_feedback_pipeline.sql:/docker-entrypoint-initdb.d/56_feedback_pipeline.sql:ro
      - ./database/57_project_auto_no.sql:/docker-entrypoint-initdb.d/57_project_auto_no.sql:ro
      - ./database/58_node_parent.sql:/docker-entrypoint-initdb.d/58_node_parent.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plm -d plm_v4"]
      interval: 10s
      retries: 5
      start_period: 15s
    networks:
      - plm-network

  # ============ Redis ============
  redis:
    image: redis:7-alpine
    container_name: plm-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
    networks:
      - plm-network

  # ============ Backend (Java Spring Boot) ============
  backend:
    build:
      context: ./plm-backend
      dockerfile: Dockerfile
    container_name: plm2-backend
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/plm_v4?stringtype=unspecified
      SPRING_DATASOURCE_USERNAME: plm
      SPRING_DATASOURCE_PASSWORD: plm@123
      SPRING_REDIS_HOST: redis
      PLM_FILE_INTRANET_DIR: /data/files/intranet
      PLM_FILE_EXTRANET_DIR: /data/files/extranet
      PLM_ALGORITHM_BASE_URL: http://algorithm:8001
      # PLM → EBMS 即时同步(事件 webhook 推送)
      WEBHOOK_ENABLED: "true"
      PLM_EBMS_WEBHOOK_URL: ${PLM_EBMS_WEBHOOK_URL:-http://192.168.0.71:5000/api/sync/events}
      # 大模型(OpenAI 兼容)：恒剑PLM智能体回复 + AEOS 执行面推理；key 为空时回落模板回复
      PLM_LLM_BASE_URL: ${PLM_LLM_BASE_URL:-}
      PLM_LLM_API_KEY: ${PLM_LLM_API_KEY:-}
      PLM_LLM_MODEL: ${PLM_LLM_MODEL:-}
      # AEOS Hub 能力调用(PLM 作为请求方借调中台只读能力)
      AEOS_HUB_BASE_URL: ${AEOS_HUB_BASE_URL:-https://aeos-hub.test:9444}
      AEOS_HUB_SYSTEM_ID: ${AEOS_HUB_SYSTEM_ID:-hengjian-plm}
      AEOS_HUB_SYSTEM_TOKEN: ${AEOS_HUB_SYSTEM_TOKEN:-}
    volumes:
      - plm_files:/data/files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - plm-network

  # ============ Frontend (Vue 3 + Nginx) ============
  frontend:
    build:
      context: ./plm-frontend
      dockerfile: Dockerfile
    container_name: plm2-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - plm-network

  # ============ AEOS 执行面智能体 (反向连接 AEOS Hub, 只读查询 PLM) ============
  aeos-execution-agent:
    build:
      context: ./aeos-execution-agent
      dockerfile: Dockerfile
    container_name: plm2-aeos-agent
    restart: unless-stopped
    env_file:
      - ./aeos-execution-agent/.env
    environment:
      # 容器网络内走服务名；覆盖 .env 中的宿主机地址
      TARGET_QUERY_BASE_URL: http://backend:8080/api
      # 提供方阶段仅出站访问 ws://192.168.0.23:8788，不使用 9444 TLS，故不再关闭 TLS 校验
    extra_hosts:
      - "aeos-hub.test:192.168.0.23"
    volumes:
      # 本机磁盘只读挂载, 供 query_local_files 能力访问(白名单根 /local/d)
      - type: bind
        source: "d:/"
        target: /local/d
        read_only: true
    depends_on:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - plm-network

  # ============ Algorithm (Python FastAPI) ============
  algorithm:
    build:
      context: ./plm-algorithm
      dockerfile: Dockerfile
    container_name: plm-algorithm
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - plm_files:/data/files
    networks:
      - plm-network

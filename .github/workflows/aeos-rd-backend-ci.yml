name: AEOS R&D Backend CI

on:
  pull_request:
    paths:
      - 'plm-backend/**'
      - 'database/**'
      - '.github/workflows/aeos-rd-backend-ci.yml'
  push:
    branches:
      - 'aeos-rd-v0.2-plm2-v1.1'
    paths:
      - 'plm-backend/**'
      - 'database/**'

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plm-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Maven tests
        run: mvn -B test
